<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concord</title>
    <style>
      :root {
        --bg: #0f1115; --panel: #171a21; --line: #272b35;
        --fg: #e6e8ee; --dim: #8b93a7;
        --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .app { max-width: 1280px; margin: 0 auto; padding: 20px; }
      .grid { display: grid; grid-template-columns: 1fr 380px; gap: 16px; align-items: start; }
      @media (max-width: 950px) { .grid { grid-template-columns: 1fr; } }
      .panel {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 14px; margin-bottom: 16px;
      }
      .panel h2 { margin: 0 0 4px; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
      .panel .sub { margin: 0 0 12px; font-size: 12px; color: var(--dim); }
      textarea {
        width: 100%; min-height: 300px; resize: vertical;
        background: #0b0d12; color: var(--fg);
        border: 1px solid var(--line); border-radius: 8px; padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px; line-height: 1.6;
      }
      textarea:focus { outline: 1px solid var(--accent); }
      button {
        background: #21262d; color: var(--fg); border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
      }
      button:hover { border-color: var(--accent); }
      button.danger { border-color: #5a2020; color: #ffb0aa; }
      button.danger:hover { background: #3a1414; }
      .badge {
        display: inline-block; padding: 1px 7px; border-radius: 20px;
        font-size: 11px; font-weight: 600; letter-spacing: .03em;
      }
      .badge.leader { background: #12341c; color: var(--ok); }
      .badge.follower { background: #1b2433; color: var(--accent); }
      .badge.dead, .badge.unreachable { background: #3a1414; color: var(--bad); }
      .badge.candidate { background: #33290c; color: var(--warn); }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .scroll { max-height: 300px; overflow-y: auto; }
      .item { border-bottom: 1px solid var(--line); padding: 7px 0; font-size: 12px; }
      .item:last-child { border-bottom: none; }
      .dim { color: var(--dim); }
      .tiny { font-size: 11px; }
      .strike { text-decoration: line-through; opacity: .55; }
      input[type="text"] {
        background: #0b0d12; color: var(--fg); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 8px; font-size: 12px;
      }
      label.check { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
